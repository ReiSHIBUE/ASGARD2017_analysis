name: pipeline

# Re-runs both analysis pipelines from scratch inside the container defined by
# the repository Dockerfile, and publishes the regenerated figures and tables
# as a build artifact.
#
# The image layers are cached in GitHub's container registry, so only the first
# run — or a change to the Dockerfile / docker/install_packages.R — pays the
# R package installation cost.
#
# Map scripts need a Stadia Maps API key. Add it as a repository secret named
# STADIA_MAPS_KEY to have them run; without it they are skipped and the run
# still passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # monthly, so dependency bit-rot surfaces on its own
    - cron: "0 6 1 * *"

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase, as ghcr requires)
        id: img
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/analysis" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Pushes to the registry (and the layer cache) only work on branches of
      # this repository — pull requests from forks get a read-only token.
      - name: Log in to ghcr.io
        id: login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: asgard2017:ci
          cache-from: type=registry,ref=${{ steps.img.outputs.ref }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.img.outputs.ref) || '' }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          docker tag asgard2017:ci "${{ steps.img.outputs.ref }}:latest"
          docker push "${{ steps.img.outputs.ref }}:latest"

      - name: Start from a clean output tree
        # The repository tracks previous outputs; remove them so the artifact
        # contains only what this run produced.
        # 過去の出力を削除し、この実行で生成されたものだけを残す
        run: rm -rf output output_p

      - name: Run both pipelines
        env:
          STADIA_MAPS_KEY: ${{ secrets.STADIA_MAPS_KEY }}
        run: |
          docker run --rm \
            -e STADIA_MAPS_KEY \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -u "$(id -u):$(id -g)" \
            asgard2017:ci

      - name: Summary
        if: always()
        run: |
          {
            echo '## Pipeline run'
            echo
            if [ -f output/repro/key_numbers.txt ]; then
              echo '```'
              cat output/repro/key_numbers.txt | sed -n '1,40p'
              echo '```'
            fi
            if [ -f output/repro/script_status.csv ]; then
              echo '<details><summary>Per-script status</summary>'
              echo
              echo '```csv'
              cat output/repro/script_status.csv
              echo '```'
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-output
          path: |
            output/
            output_p/
          retention-days: 30
